# ================================================================
# PLAYBOOK SPEC: PaymentCredits
# Payment Terms and Credits
# ================================================================

family_id: PaymentCredits
display_name: "Payment Terms and Credits"
version: "2.0"
last_updated: "2025-01-29"
priority: CRITICAL
requires_legal_review: true

# ================================================================
# AMAZON'S POSITION
# ================================================================

amazon_position:
  summary: |
    Payment should be tied to verifiable milestones and delivery 
    conditions. Amazon must have offset rights and audit rights. 
    Credits should follow industry standards with Amazon having 
    approval rights over placement and content.
  
  core_requirements:
    - Clear milestone-based payment schedule
    - Payment conditioned on satisfactory delivery
    - Offset rights for damages and overpayments
    - Audit rights over production costs
    - Credit approval rights for above-the-line talent
    - Standard studio credit placement
    - Payment terms (net 30/45)
    - Invoice requirements
  
  business_rationale: |
    Production financing requires accountability. Milestone payments 
    ensure work progresses before additional funding. Offset rights 
    protect against overpayment and breach claims. Credit matters 
    create disputes; clear approval rights prevent conflicts.

# ================================================================
# ACCEPTABILITY MATRIX
# ================================================================

acceptability:
  
  acceptable:
    description: "Clear payment terms with appropriate protections"
    
    required_elements:
      - element: "Milestone-based payments"
        language: |
          The Production Fee shall be payable in installments upon 
          achievement of the milestones set forth in Exhibit A.
        required: true
        
      - element: "Delivery condition"
        language: |
          Each installment shall be conditioned upon Amazon's 
          confirmation that the applicable milestone has been 
          satisfactorily achieved.
        required: true
        
      - element: "Offset rights"
        language: |
          Amazon may offset against any amounts due to ProdCo any 
          amounts owed by ProdCo to Amazon, including damages and 
          overpayments.
        required: true
        
      - element: "Audit rights"
        language: |
          Amazon shall have the right to audit ProdCo's books and 
          records relating to production costs.
        required: true
        
      - element: "Invoice requirements"
        language: |
          ProdCo shall submit invoices with supporting documentation.
        required: true
        
      - element: "Credit approval"
        language: |
          Amazon shall have approval over the placement, form, and 
          content of all credits.
        required: true
    
    example_acceptable:
      - text: |
          Amazon shall pay ProdCo the Production Fee in accordance with 
          the payment schedule in Exhibit A, subject to satisfactory 
          achievement of milestones. Amazon may offset any amounts due 
          against damages, overpayments, or other amounts owed. Amazon 
          shall have audit rights over production costs. All credits 
          shall be subject to Amazon's prior written approval as to 
          placement, form, and content.
        rating: ACCEPTABLE
        confidence: 0.95

  passable:
    description: "Payment terms with minor modifications"
    requires_approval: "AMAZON_LEGAL"
    
    passable_variations:
      - variation: "Extended payment terms"
        condition: "Up to net 45 days"
        example: |
          Payments shall be due within forty-five (45) days of invoice.
        risk_level: LOW
        
      - variation: "Contingent compensation"
        condition: "Tied to performance with clear definitions"
        example: |
          ProdCo shall receive bonus compensation of [X]% of Net Profits, 
          as defined in Exhibit B.
        risk_level: MEDIUM
        notes: "Net Profits definition must be reviewed carefully"
        
      - variation: "Credit consultation"
        condition: "Amazon approves but consults with ProdCo"
        example: |
          Amazon shall consult with ProdCo regarding credit placement 
          but Amazon's determination shall be final.
        risk_level: LOW

  unacceptable:
    description: "Payment provisions that create risk or ambiguity"
    action: "REJECT"
    
    unacceptable_patterns:
      - pattern: "Upfront full payment"
        example: |
          Amazon shall pay the full Production Fee upon execution.
        reason: "Payments should be tied to milestones and delivery"
        risk_level: CRITICAL
        
      - pattern: "No offset rights"
        example: |
          Amazon shall pay all amounts due without deduction or offset.
        reason: "Amazon must be able to offset damages and overpayments"
        risk_level: CRITICAL
        
      - pattern: "ProdCo credit control"
        example: |
          ProdCo shall determine all credits in its sole discretion.
        reason: "Amazon must have credit approval"
        risk_level: HIGH
        
      - pattern: "No audit rights"
        example: |
          [Agreement without audit provision for production costs]
        reason: "Amazon must verify proper use of production funds"
        risk_level: CRITICAL
        
      - pattern: "Interest on late payment with short period"
        example: |
          Interest shall accrue at 18% per annum on amounts not paid 
          within ten (10) days.
        reason: "Reasonable payment terms and interest rates required"
        risk_level: MEDIUM
        
      - pattern: "Gross participation"
        example: |
          ProdCo shall receive 5% of Gross Receipts from first dollar.
        reason: "Gross participations create alignment issues; prefer net"
        risk_level: HIGH

# ================================================================
# NEGOTIATION GUIDANCE
# ================================================================

negotiation:
  priorities:
    - priority: 1
      element: "Milestone-based payments"
      position: "Payments tied to verifiable milestones"
      fallback: "None - essential"
      
    - priority: 2
      element: "Offset rights"
      position: "Broad offset rights"
      fallback: "None - essential"
      
    - priority: 3
      element: "Audit rights"
      position: "Full audit rights over production costs"
      fallback: "Annual audit right with reasonable notice"
      
    - priority: 4
      element: "Credit approval"
      position: "Amazon final approval"
      fallback: "Consultation with Amazon final determination"
  
  common_counterparty_requests:
    - request: "More front-loaded payment schedule"
      response: "Resist unless justified by cash flow needs"
      alternative: |
        Consider letter of credit or escrow for production security 
        instead of accelerated payments.
      
    - request: "Producer credit guarantee"
      response: "Acceptable if standard placement"
      alternative: |
        Accept: "Producer shall receive produced by credit on single 
        card, subject to applicable guild requirements."
      
    - request: "Net profits participation"
      response: "Negotiable"
      alternative: |
        Acceptable with standard net profits definition attached as 
        exhibit. Ensure definition includes all appropriate deductions.

# ================================================================
# RISK ASSESSMENT
# ================================================================

risk_assessment:
  factors:
    - factor: "Budget size"
      high_risk: "Large budget with significant payment exposure"
      low_risk: "Smaller budget with limited exposure"
      
    - factor: "ProdCo financial stability"
      high_risk: "New company or limited capitalization"
      low_risk: "Established company with track record"
  
  escalation_triggers:
    - "Payment not tied to milestones"
    - "No offset rights"
    - "No audit rights"
    - "Gross participation requests"
    - "Credit control vested in ProdCo"
