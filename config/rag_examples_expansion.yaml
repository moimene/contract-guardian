# ================================================================
# RightsGrant - CRÍTICO (Antes: 0 examples → 0% accuracy)
# ================================================================
- example_id: RG-001
  family: RightsGrant
  article: "3.1"
  clause_text: |
    RIGHTS: All rights in the Program, including all materials 
    commissioned (including the results and proceeds of services 
    of all personnel rendering services), are being specially 
    ordered and commissioned by Amazon as a work made for hire 
    for Amazon. Amazon shall be the author and exclusive owner 
    for copyright purposes and otherwise. To the extent that any 
    of the foregoing may not be considered a work made for hire, 
    ProdCo hereby irrevocably assigns to Amazon all right, title, 
    and interest in and to the Program and all such materials, 
    including all copyrights.
  rating: ACCEPTABLE
  confidence: 0.95
  key_triggers:
    - "All rights in the Program"
    - "work made for hire"
    - "exclusive owner"
    - "irrevocably assigns"
    - "all right, title, and interest"
    - "including all copyrights"

- example_id: RG-002
  family: RightsGrant
  article: "3.2"
  clause_text: |
    Amazon shall own exclusively and in perpetuity, throughout 
    the universe, in all languages, and in all media now known 
    or hereafter developed, all right, title, and interest in 
    and to the Program.
  rating: ACCEPTABLE
  confidence: 0.98
  key_triggers:
    - "Amazon shall own exclusively"
    - "in perpetuity"
    - "throughout the universe"
    - "in all media"
    - "now known or hereafter developed"

- example_id: RG-003
