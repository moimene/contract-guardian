# ================================================================
# FAMILY: Insurance
# Source: PSA Section 8 "MISCELLANEOUS" - Standard Terms
# Version: 2026-01-30
# ================================================================

family_id: Insurance
rule_name: "Insurance"
psa_section: 8
required: true
priority: HIGH

# ================================================================
# STANDARD POSITION (From PSA Fallback Guide)
# ================================================================
standard_position: |
  This Agreement includes and incorporates industry custom standard 
  terms and conditions for agreements of this type, such as insurance 
  and additional representations/warranties, indemnification and 
  remedies.

# ================================================================
# NOTES
# ================================================================
notes: |
  Insurance requirements are typically addressed in the Standard Terms 
  and Conditions (STCs) that are negotiated separately. The PSA 
  incorporates these by reference. Key insurance requirements typically 
  include:
  - Errors & Omissions (E&O) insurance
  - General Liability insurance
  - Workers' Compensation insurance
  - Cast insurance (if applicable)
  
  Amazon recognizes a line item in the budget for E&O insurance funded 
  by Amazon that covers claims regardless of ProdCo's level of negligence 
  or intent, provided there is no fraud.

# ================================================================
# DETECTION TRIGGERS
# ================================================================
triggers:
  primary:
    - "insurance"
    - "E&O"
    - "errors and omissions"
  secondary:
    - "general liability"
    - "workers' compensation"
    - "cast insurance"
    - "standard terms and conditions"

# ================================================================
# DETECTION PATTERNS (CG-012 Guardrail)
# Version: 2026-02-02 - From Legal Team Review
# ================================================================
detection_patterns:
  red_flags:
    - "reasonable efforts to obtain"
    - "proceed without such coverage"
    - "E&O insurance shall be optional"
    - "ProdCo's discretion"
    - "Amazon may not specify"
    - "limits determined by ProdCo"
    - "$500,000"
    - "excess over Amazon's own insurance"
    - "secondary"
    - "no additional insured"
    - "waive subrogation"
    - "sole negligence"
    - "not commercially available"
    - "Amazon shall obtain and pay for E&O"
    - "Amazon bears all costs"
    - "intellectual property exclusion"
  must_have:
    - "additional insured"
    - "primary and non-contributory"
    - "certificate"
    - "errors and omissions"
  strong_indicators:
    - "insurance"
    - "Commercial General Liability"
    - "Workers' Compensation"
    - "Umbrella"
    - "ACORD"
    - "cancellation notice"
    - "additional insured"
    - "waiver of subrogation"
    - "per occurrence"
    - "aggregate"
